name: Generate seasonal 3D contributions

on:
  schedule:
    - cron: "0 18 * * *" # 00:00 Asia/Dhaka; GitHub cron uses UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate seasonal 3D graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Replay the seasonal animation every 30 seconds
        run: node .github/scripts/loop-season.mjs

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh seasonal 3D contributions"
            git push
          fi
