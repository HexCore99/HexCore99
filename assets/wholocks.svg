<svg xmlns="http://www.w3.org/2000/svg" width="292" height="212" viewBox="0 0 292 212">
  <title>WhoLocks — windows utility</title>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#a6edbf" opacity=".35"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="290" height="210" rx="5" fill="#181923" stroke="#726d89" stroke-width="2"/>
  <rect x="6" y="6" width="280" height="77" fill="#233e35"/>
  <rect x="6" y="6" width="280" height="77" fill="url(#grid)"/>
  <g shape-rendering="crispEdges">
    <!-- File Explorer window and a process holding the file. -->
    <path fill="#151c20" stroke="#78aa95" stroke-width="2" d="M47 16h122v56H47z"/>
    <path fill="#4d7767" d="M48 17h120v9H48z"/>
    <path fill="#d4eee0" d="M54 20h4v3h-4zm8 0h4v3h-4z"/>
    <path fill="#9ed8b7" d="M60 36h16l4 5h17v18H60z"/>
    <path fill="#ecdaaa" d="M62 45h34l-3 14H62z"/>
    <path fill="#7b9b8e" d="M109 39h39v3h-39zm0 9h27v3h-27z"/>
    <path fill="#172824" stroke="#9ad7b8" stroke-width="2" d="M150 42h85v32h-85z"/>
    <path fill="#a6edbf" d="M162 52h3v3h-3zm3 3h3v3h-3zm-3 3h3v3h-3zm11 2h9v2h-9z"/>
  </g>
  <g font-family="Consolas, monospace">
    <text x="15" y="102" fill="#a6edbf" font-size="12" letter-spacing="1">WINDOWS UTILITY</text>
    <text x="14" y="128" fill="#fff8ec" font-weight="bold" font-size="25">WhoLocks</text>
    <path fill="#a6edbf" d="M259 113h13v13h-3v-8l-10 10-2-2 10-10h-8z"/>
    <text x="15" y="151" fill="#e3dfeb" font-size="16">Find the process holding</text>
    <text x="15" y="171" fill="#e3dfeb" font-size="16">a file or folder open.</text>
    <path stroke="#434252" d="M15 183h262"/>
    <text x="15" y="201" fill="#c6c3d4" font-size="14">Rust / Windows API</text>
  </g>
