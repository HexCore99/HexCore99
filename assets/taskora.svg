<svg xmlns="http://www.w3.org/2000/svg" width="292" height="212" viewBox="0 0 292 212">
  <title>Taskora — desktop app</title>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#cebcff" opacity=".35"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="290" height="210" rx="5" fill="#181923" stroke="#726d89" stroke-width="2"/>
  <rect x="6" y="6" width="280" height="77" fill="#39304e"/>
  <rect x="6" y="6" width="280" height="77" fill="url(#grid)"/>
  <g shape-rendering="crispEdges">
    <!-- Three lanes of an offline Kanban board. -->
    <path fill="#232132" stroke="#ab9bca" stroke-width="2" d="M59 14h174v60H59z"/>
    <path fill="#695d82" d="M60 15h172v9H60z"/>
    <path fill="#dacaf7" d="M66 18h4v3h-4zm8 0h4v3h-4z"/>
    <path fill="#383446" d="M66 29h49v39H66zm55 0h49v39h-49zm55 0h50v39h-50z"/>
    <path fill="#d5b7f5" d="M71 34h26v3H71z"/><path fill="#e1bd87" d="M126 34h26v3h-26z"/><path fill="#a7d6bf" d="M181 34h26v3h-26z"/>
    <path fill="#80718e" d="M71 42h38v8H71zm0 12h30v8H71zm55-12h38v8h-38zm55 0h39v8h-39z"/>
  </g>
  <g font-family="Consolas, monospace">
    <text x="15" y="102" fill="#cebcff" font-size="12" letter-spacing="1">DESKTOP APP</text>
    <text x="14" y="128" fill="#fff8ec" font-weight="bold" font-size="25">Taskora</text>
    <path fill="#cebcff" d="M259 113h13v13h-3v-8l-10 10-2-2 10-10h-8z"/>
    <text x="15" y="151" fill="#e3dfeb" font-size="16">An offline Kanban board</text>
    <text x="15" y="171" fill="#e3dfeb" font-size="16">that keeps tasks local.</text>
    <path stroke="#434252" d="M15 183h262"/>
    <text x="15" y="201" fill="#c6c3d4" font-size="14">Tauri / React / Rust / SQLite</text>
  </g>
</svg>
